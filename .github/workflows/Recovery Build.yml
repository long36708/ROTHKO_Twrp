name: OrangeFox Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL (橙狐官方同步脚本仓库; SSH 请用 git@gitlab.com:OrangeFox/sync.git)'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH (橙狐分支: 14.1 / 12.1)'
        required: true
        default: '14.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/long36708/device_vivo_pd2415_twrp'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/vivo/pd2415'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'pd2415'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME (不带 -eng 后缀)'
        required: true
        default: 'twrp_pd2415-ap2a'
      BUILD_TARGET:
        description: 'BUILD_TARGET (make 目标, 空格分隔)'
        required: true
        default: 'recoveryimage vendorbootimage'
      JAVA_VERSION:
        description: 'JAVA_VERSION (fox_14.1 用 17, fox_12.1 用 11)'
        required: true
        default: '17'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Sync URL: ${{ github.event.inputs.SYNC_URL }}"
        echo "Manifest Branch: fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}-eng"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
        echo "Java Version: ${{ github.event.inputs.JAVA_VERSION }}"
        echo "::endgroup::"
 
    # You might want to Checkout your repo first, but not mandatory
    - name: Check Out
      uses: actions/checkout@v3
    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      # That's it! Now use your normal steps

    - name: Prepare the environment
      run: |
        sudo add-apt-repository -y universe
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libwxgtk3.2-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev python3

    - name: Install OpenJDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: ${{ github.event.inputs.JAVA_VERSION }}

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.SYNC_URL, 'git@') ||
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.5.4
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}


    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Maximize build space
      run: |
        # fox_14.1 needs ~85GB; trim the preinstalled toolchains first.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell || true
        df -h || true

    - name: Sync OrangeFox sources
      run: |
        mkdir -p workspace
        cd workspace
        git config --global user.name "Nico170420"
        git config --global user.email "b170420nc@gmail.com"
        # Official OrangeFox sync: pulls the matching TWRP minimal manifest, applies
        # the OrangeFox manifest/vold/update_engine/vendor-twrp patches, then clones
        # bootable/recovery (fox_<branch>) and vendor/recovery (fox_<branch>).
        # Do NOT hand-clone vendor/orangefox on top of this.
        git clone --depth=1 ${{ github.event.inputs.SYNC_URL }} ofox-sync
        FOX_DIR="$GITHUB_WORKSPACE/workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
        bash ofox-sync/orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path "$FOX_DIR"
        echo "workspace-folder=$FOX_DIR" >> $GITHUB_OUTPUT
      id: pwd
      
    - name: Clone device tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != null
        && github.event.inputs.COMMON_PATH != null
      run: |
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Apply device tree patches
      run: |
        # apply-patches.sh must run from the OrangeFox source root; it is a
        # no-op while patches/recovery/ holds no *.patch files.
        if [ -f ${{ github.event.inputs.DEVICE_PATH }}/apply-patches.sh ]; then
          chmod +x ${{ github.event.inputs.DEVICE_PATH }}/apply-patches.sh
          sh ${{ github.event.inputs.DEVICE_PATH }}/apply-patches.sh
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Sync Device Dependencies
      run: |
        # OrangeFox device trees ship omni_<codename>.dependencies (older) or
        # twrp_<codename>.dependencies; convert whichever is present.
        for dep in omni twrp; do
          f="${{ github.event.inputs.DEVICE_PATH }}/$dep.dependencies"
          if [ -f "$f" ]; then
            bash ${GITHUB_WORKSPACE}/scripts/convert.sh "$f"
            break
          fi
        done
        repo sync -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building OrangeFox
      run: |
        source build/envsetup.sh
        export LC_ALL=C
        export ALLOW_MISSING_DEPENDENCIES=true
        # FOX_* / OF_* variables MUST be exported here (they are ignored in .mk files).
        export FOX_BUILD_DEVICE=${{ github.event.inputs.DEVICE_NAME }}
        export FOX_BUILD_TYPE=Unofficial
        # pd2415 is a virtual A/B device carrying recovery in vendor_boot.
        export FOX_AB_DEVICE=1
        export FOX_VIRTUAL_AB_DEVICE=1
        # The tree ships a prebuilt kernel -> avoid the "NO KERNEL CONFIG" error.
        export OF_FORCE_PREBUILT_KERNEL=1
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        make clean
        make ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check the output directory before uploading
      run: |
        OUT_DIR=workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        ls -all "$OUT_DIR" || true
        find "$OUT_DIR" -maxdepth 1 -name "OrangeFox-*" -o -maxdepth 1 -name "vendor_boot.img" || true

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-*.img
          workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-*.zip
          workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
          workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          OrangeFox branch: fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
